
<!DOCTYPE html>
<html lang="en" class="dark" style="scroll-behavior: smooth;">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="256x256" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUH4RHQ | API Engineer & Bot Dev</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;600;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-bg: #050505;
            --color-surface: #0a0a0d;
            --color-primary: #18181B;
            --color-secondary: #3F3F46;
            --color-text: #FAFAFA;
            --color-accent-solid: #2563EB;
            --color-accent-start: #00f2fe;
            --color-accent-end: #4facfe;
            --color-accent-violet: #8b5cf6;
            --color-accent-glow: rgba(0, 242, 254, 0.4);
            --neon: var(--color-accent-solid);
            --neon-glow: rgba(37, 99, 235, 0.5);
            --bg: var(--color-primary);
            --text: var(--color-text);
            --secondary: var(--color-secondary);
        }
        body {
            font-family: 'Archivo', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            overflow-x: hidden;
            cursor: none;
            -webkit-font-smoothing: antialiased;
        }
        .font-jakarta { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-archivo { font-family: 'Archivo', sans-serif; }
        .font-space { font-family: 'Space Grotesk', sans-serif; }
        
        .noise {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            opacity: 0.03;
            z-index: 9999;
            background-image: url('https://grainy-gradients.vercel.app/noise.svg');
        }

        .grid-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(to right, color-mix(in srgb, var(--color-accent-solid) 5%, transparent) 1px, transparent 1px),
                              linear-gradient(to bottom, color-mix(in srgb, var(--color-accent-solid) 5%, transparent) 1px, transparent 1px);
            background-size: 80px 80px;
            z-index: -1;
            pointer-events: none;
        }

        #custom-cursor {
            width: 8px;
            height: 8px;
            background: var(--neon);
            border-radius: 2px;
            position: fixed;
            pointer-events: none;
            z-index: 10000;
            transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1), height 0.3s cubic-bezier(0.16, 1, 0.3, 1), transform 0.08s linear, background 0.3s;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px var(--neon-glow);
        }
        
        #cursor-follower {
            width: 44px;
            height: 44px;
            border: 1px solid color-mix(in srgb, var(--color-accent-solid) 20%, transparent);
            border-radius: 4px;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1), height 0.4s cubic-bezier(0.16, 1, 0.3, 1), left 0.2s cubic-bezier(0.16, 1, 0.3, 1), top 0.2s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s;
            transform: translate(-50%, -50%);
        }

        .cursor-hover #custom-cursor {
            width: 80px;
            height: 80px;
            background: var(--neon);
            mix-blend-mode: overlay;
            border-radius: 50%;
        }
        
        .cursor-hover #cursor-follower {
            width: 100px;
            height: 100px;
            opacity: 0;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--secondary); border-radius: 0; }
        ::-webkit-scrollbar-thumb:hover { background: var(--neon); }

        @keyframes scan {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
        .scanline {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 4px;
            background: linear-gradient(to bottom, transparent, color-mix(in srgb, var(--color-accent-solid) 5%, transparent), transparent);
            z-index: 9998;
            pointer-events: none;
            animation: scan 10s linear infinite;
        }

        @keyframes glitch {
            0% { clip-path: inset(80% 0 0 0); transform: translate(-2px, -2px); }
            10% { clip-path: inset(10% 0 85% 0); transform: translate(2px, 2px); }
            20% { clip-path: inset(80% 0 0 0); transform: translate(-2px, -2px); }
            30% { clip-path: inset(10% 0 85% 0); transform: translate(2px, 2px); }
            40% { clip-path: inset(50% 0 30% 0); transform: translate(-2px, -2px); }
            50% { clip-path: inset(10% 0 85% 0); transform: translate(2px, 2px); }
            60% { clip-path: inset(80% 0 0 0); transform: translate(-2px, -2px); }
            70% { clip-path: inset(10% 0 85% 0); transform: translate(2px, 2px); }
            80% { clip-path: inset(50% 0 30% 0); transform: translate(-2px, -2px); }
            90% { clip-path: inset(10% 0 85% 0); transform: translate(2px, 2px); }
            100% { clip-path: inset(80% 0 0 0); transform: translate(-2px, -2px); }
        }

        .glitch-text:hover {
            animation: glitch 0.3s cubic-bezier(.25, .46, .45, .94) both infinite;
            text-shadow: 2px 0 #ff00c1, -2px 0 #00fff9;
        }

        * {
          outline: none !important;
          -webkit-tap-highlight-color: transparent;
        }
        
        ::selection { background: var(--neon); color: white; }
        ::-moz-selection { background: var(--neon); color: white; }

        .reveal-text {
            clip-path: inset(0 0 100% 0);
        }
    
        /* Campuran / Mixed Gradient */
        .text-accent {
            background: linear-gradient(135deg, var(--color-accent-start) 0%, var(--color-accent-end) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }
        .bg-accent {
            background: linear-gradient(135deg, var(--color-accent-start) 0%, var(--color-accent-end) 100%) !important;
            color: #050505 !important;
        }
        .border-accent {
            border-color: var(--color-accent-start) !important;
        }
        .accent-glow {
            box-shadow: 0 0 20px var(--color-accent-glow) !important;
        }
        .group:hover .group-hover\:text-accent {
            background: linear-gradient(135deg, var(--color-accent-start) 0%, var(--color-accent-end) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }
        .group:hover .group-hover\:bg-accent {
            background: linear-gradient(135deg, var(--color-accent-start) 0%, var(--color-accent-end) 100%) !important;
            color: #050505 !important;
        }
        .group:hover .group-hover\:border-accent {
            border-color: var(--color-accent-start) !important;
        }
        .hover\:text-accent:hover {
            background: linear-gradient(135deg, var(--color-accent-start) 0%, var(--color-accent-end) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }

</style>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              accent: {
                DEFAULT: '#00f2fe',
                hover: '#4facfe',
                glow: 'rgba(0, 242, 254, 0.4)'
              }
            }
          }
        }
      }
    </script>
    
</head>
<body>
    <div class="noise"></div>
    <div class="grid-bg"></div>
    <div class="scanline"></div>
    <div id="custom-cursor"></div>
    <div id="cursor-follower"></div>
    <div id="root">
      <div style="position:fixed;inset:0;background:#050505;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;">
        <div style="position:relative;width:140px;height:140px;display:flex;align-items:center;justify-content:center;">
          <div style="position:absolute;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle, rgba(0,242,254,0.25), rgba(139,92,246,0.12), transparent 65%);filter:blur(30px);pointer-events:none;animation:initGlow 2.5s ease-in-out infinite;"></div>
          <svg viewBox="0 0 100 100" width="140" height="140" fill="none" xmlns="http://www.w3.org/2000/svg" style="filter:drop-shadow(0 0 18px rgba(0,242,254,0.45));">
            <defs>
              <linearGradient id="initMGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#00f2fe" />
                <stop offset="50%" stop-color="#38bdf8" />
                <stop offset="100%" stop-color="#8b5cf6" />
              </linearGradient>
            </defs>
            <path d="M 15 78 L 15 22 L 50 52 L 85 22 L 85 78" stroke="url(#initMGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.15" style="filter:blur(4px);" />
            <path d="M 15 78 L 15 22 L 50 52 L 85 22 L 85 78" stroke="url(#initMGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" style="stroke-dasharray:220;stroke-dashoffset:220;animation:initMDash 1.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;" />
          </svg>
        </div>
      </div>
      <style>
        @keyframes initMDash { to { stroke-dashoffset: 0; } }
        @keyframes initGlow { 0%, 100% { opacity: 0.5; transform: scale(1); } 50% { opacity: 0.8; transform: scale(1.08); } }
      </style>
    </div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
